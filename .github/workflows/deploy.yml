name: Deploy frontend to Cloudflare

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, branch or tag to deploy (empty = the commit this run starts from). Rollback: rollback/pre-v4-live"
        required: false
        default: ""
      send_test_request:
        description: "After deploying, send one labelled test access request to aryan.hd@outlook.com"
        type: boolean
        required: false
        default: false
      check_inbound:
        description: "After deploying, list the newest received emails (masked)"
        type: boolean
        required: false
        default: false
      email_from:
        description: "Optional sender for access-request email, e.g. ARIMA Access <access@arimafinance.xyz> (after the domain is verified in Resend)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved frontend release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Frontend tests
        run: npm run test:unit

      - name: Official OpenNext production build
        run: npm run build

      - name: Validate Cloudflare artifact
        run: test -s .open-next/worker.js && test -d .open-next/assets

      - name: Report Cloudflare deployment before this deploy
        if: inputs.send_test_request || inputs.check_inbound
        run: node scripts/ci/report-cloudflare-deployment.mjs "before this deploy"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Prepare access-request Worker secrets
        run: node scripts/ci/configure-access-request-email.mjs
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ACCESS_REQUEST_ADMIN_TOKEN: ${{ secrets.ACCESS_REQUEST_ADMIN_TOKEN }}

      - name: Deploy existing Worker
        run: npm run deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set access-request Worker secrets
        run: |
          npx wrangler secret bulk "$RUNNER_TEMP/worker-secrets.json"
          rm -f "$RUNNER_TEMP/worker-secrets.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify canonical frontend
        run: |
          set -e
          for path in / /journey/ /client-portfolio/ /watch-intro/ /choose-door/ /research-projects/ /portfolio-lab/ /work-with-us/ /mind-map/ /intro/ /login/; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "https://arimafinance.xyz${path}")"
            echo "${path} ${code}"
            test "${code}" = "200"
          done

      - name: Report Cloudflare deployment after this deploy
        if: inputs.send_test_request || inputs.check_inbound
        run: node scripts/ci/report-cloudflare-deployment.mjs "after this deploy"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Check access-request email setup
        run: node scripts/ci/check-access-request-email.mjs
        env:
          EMAIL_FROM: ${{ inputs.email_from }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Send labelled test access request
        if: inputs.send_test_request
        run: node scripts/ci/send-test-access-request.mjs

      - name: Report received email
        if: inputs.check_inbound
        run: node scripts/ci/report-inbound-email.mjs
