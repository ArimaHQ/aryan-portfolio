name: Verify OpenNext build

on:
  push:
    branches:
      - release/tts-final-frontend
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Frontend tests
        run: npm run test:unit

      - name: Official OpenNext production build
        run: npm run build

      - name: Validate Cloudflare artifact
        run: test -s .open-next/worker.js
