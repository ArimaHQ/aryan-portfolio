name: validate-candidate

on:
  workflow_dispatch:
  push:
    branches: [validation/tts-client-candidate]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test:unit -- --run
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: test -d .open-next
      - run: git diff --check
